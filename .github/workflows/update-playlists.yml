name: Update YouTube Playlist Data

# Runs on a schedule and can also be triggered manually from the Actions tab.
#
# Cron format is "minute hour day month weekday", always in UTC, e.g.:
#   '0 6 * * *'      -> once a day at 06:00 UTC
#   '0 */6 * * *'    -> every 6 hours  (currently set below)
#   '0 */3 * * *'    -> every 3 hours
#   '0 * * * *'      -> every hour
#   '*/15 * * * *'   -> every 15 minutes
#
# Two things worth knowing before going very frequent:
#   1. GitHub does not guarantee scheduled runs fire at the exact minute —
#      during high load across GitHub it can delay a run by several
#      minutes to over an hour. This is normal and not a bug in this
#      workflow. GitHub also recommends against intervals shorter than
#      ~5 minutes for reliability.
#   2. It's still cheap either way: if nothing changed, the "Commit and
#      push" step below skips committing, so running often costs a little
#      CI time but never spams your commit history or burns meaningful
#      YouTube API quota (each run only uses a handful of quota units).
on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write   # needed so this workflow can commit updated data/*.json back to the repo

jobs:
  update-playlists:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # continue-on-error so that if one playlist fails, we still commit
      # whatever DID succeed, then explicitly fail the workflow afterward
      # (see last step) so you still get notified something needs attention.
      - name: Fetch playlist data from YouTube
        id: fetch
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/fetch-playlists.mjs

      - name: Commit and push data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update playlist data [automated]"
            git push
          fi

      - name: Fail the workflow if any playlist failed to fetch
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "One or more playlists failed to fetch — see the 'Fetch playlist data from YouTube' step above for details."
          exit 1